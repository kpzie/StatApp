<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0f1419">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="StatLine">
  <title>StatLine – Player Stat Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header id="topbar">
    <button id="backBtn" class="icon-btn" aria-label="Back" hidden>‹</button>
    <h1 id="title">StatLine</h1>
    <div id="topActions"></div>
  </header>
  <main id="view" tabindex="-1"></main>
  <nav id="tabbar" aria-label="Main">
    <a href="#/players" data-tab="players"><span class="ti">👤</span><span>Players</span></a>
    <a href="#/games" data-tab="games"><span class="ti">📋</span><span>Games</span></a>
    <a href="#/settings" data-tab="settings"><span class="ti">⚙️</span><span>Data</span></a>
  </nav>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="js/stats.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
