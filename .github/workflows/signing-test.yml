name: Signing test (throwaway)
on:
  push:
    branches: [signing-test]
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - name: Install Android SDK platform and build tools
        run: |
          SDKM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci && npx cap sync android
      - name: Make disposable keystore
        run: keytool -genkeypair -storetype PKCS12 -keystore $RUNNER_TEMP/t.jks -alias upload -keyalg RSA -keysize 2048 -validity 30 -storepass testpass123 -keypass testpass123 -dname "CN=throwaway"
      - name: Build signed bundle
        working-directory: android
        env:
          STATLINE_KEYSTORE_PATH: ${{ runner.temp }}/t.jks
          STATLINE_KEYSTORE_PASSWORD: testpass123
          STATLINE_KEY_ALIAS: upload
          VERSION_CODE: '42'
        run: chmod +x gradlew && ./gradlew bundleRelease --no-daemon --stacktrace
      - name: Verify
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          ls -l $AAB
          jarsigner -verify -verbose:summary $AAB | tee v.txt | head -5
          grep -q "jar verified" v.txt
          keytool -printcert -jarfile $AAB | grep -E "Owner|SHA256" | head -2
          python3 - <<'PY'
          import zipfile,re
          z=zipfile.ZipFile("android/app/build/outputs/bundle/release/app-release.aab")
          print("has base manifest:", "base/manifest/AndroidManifest.xml" in z.namelist())
          PY
